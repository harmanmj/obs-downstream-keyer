# Fork only: builds the Flatpak OBS extension bundle (com.obsproject.Studio.Plugin.DownstreamKeyer) from the
# commit being built, using flatpak/com.obsproject.Studio.Plugin.DownstreamKeyer.yaml. Called by Dispatch
# (build, build-flatpak) and by Push for tags, where the bundle is attached to the release.
name: Build Flatpak Bundle
on:
  workflow_call:
permissions:
  contents: read
jobs:
  flatpak:
    name: Build Flatpak Bundle 📦
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Set Up Names 🏷️
        id: names
        run: |
          : Set Up Names 🏷️
          name="$(jq -r .name src/buildspec.json)"
          [[ "${name}" == obs-* ]] || name="obs-${name}"
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(jq -r .version src/buildspec.json)-${GITHUB_SHA:0:9}"
          fi
          echo "bundle=${name}-${version}-flatpak-x86_64.flatpak" >> $GITHUB_OUTPUT
          # the release job finds artifacts by "-<variant>-<commit hash>"
          echo "artifact=${name}-flatpak-x86_64-${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      - name: Install flatpak-builder 🧰
        run: |
          : Install flatpak-builder 🧰
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Prepare Manifest 📝
        run: |
          : Prepare Manifest 📝
          # build the checked out commit instead of the git source named in the manifest
          cp src/flatpak/com.obsproject.Studio.Plugin.DownstreamKeyer.yaml build.yaml
          command -v yq >/dev/null || sudo snap install yq
          yq -i '.modules[0].sources = [{"type": "dir", "path": "src"}]' build.yaml
          cat build.yaml

      - name: Build Flatpak 🧱
        run: |
          : Build Flatpak 🧱
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo builddir build.yaml
          flatpak build-bundle --runtime repo "${{ steps.names.outputs.bundle }}" \
            com.obsproject.Studio.Plugin.DownstreamKeyer stable
          ls -l "${{ steps.names.outputs.bundle }}"

      - name: Upload Flatpak Bundle 📡
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ github.workspace }}/${{ steps.names.outputs.bundle }}
